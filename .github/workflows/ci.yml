name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build
      # Fails the build if the model changed without a migration.
      - run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project src/Codegrove.Api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The in-browser C# runner (.NET on WebAssembly) is built from src/ and copied into public/csharp-runner.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm test
      - run: npm run build:csharp
      - run: npm run build
        env:
          VITE_PREVIEW_ORIGIN: https://preview.codegrove-usercontent.example
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist