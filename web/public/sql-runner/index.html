<!doctype html>
<!--
  Codegrove SQL runner host. Served from the preview origin (like runner.html), never the app's origin,
  and loaded by the app in a hidden <iframe sandbox="allow-scripts allow-same-origin">. allow-same-origin
  is needed to start a Web Worker from this origin; it gives this page the PREVIEW origin, which holds no
  cookies or data, not the app's.

  It starts worker.js, which runs SQLite compiled to WebAssembly (sql.js) and src/runner/sqlEngine.ts.
  worker.js, sql-wasm.js and sql-wasm.wasm are generated by vite-plugins/sqlRunner.ts (in dev and in
  builds). The app sends runs here; this page passes them to the worker one at a time, and stops and
  replaces the worker if a run takes too long, so a query that never ends can't freeze anything.

  Messages (all carry the id of the run they belong to):
    app  → host  { type: 'cg:sql-run', id, request }        request = { setup, files, tests }
    host → app   { type: 'cg:sql-status', status, detail? }  'loading' | 'ready' | 'failed'
    host → app   { type: 'cg:sql-result', id, result }       result: SqlRunResult in src/runner/sqlEngine.ts
    host → app   { type: 'cg:sql-result', id, timedOut: true }
    host → app   { type: 'cg:sql-result', id, failed }
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <title>SQL runner</title>
  </head>
  <body>
    <script src="host.js"></script>
  </body>
</html>
